<div class="vl-up">
  <span class="em" aria-hidden="true"><anvil-component type="Label" name="emoji" bind:text="self.item['emoji']"></anvil-component></span>
  <div>
    <h3><anvil-component type="Label" name="name" bind:text="self.item['name']"></anvil-component></h3>
    <p><anvil-component type="Label" name="blurb" bind:text="self.item['blurb']"></anvil-component></p>
    <div class="vl-pips" anvil:name="pips"><anvil-component type="RepeatingPanel" name="pips_panel" prop:item_template="Snackpuncher.Items.Pip" prop:role='["contents"]'></anvil-component></div>
  </div>
  <anvil-component type="Button" name="buy_button" prop:role='["btn", "btn-sm"]'></anvil-component>
  <span class="ui-badge good" anvil:name="maxed">Maxed</span>
</div>
